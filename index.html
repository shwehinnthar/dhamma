<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ကြည်နူးဖွယ်ရာ ဓမ္မကမ္ဘာ</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Myanmar:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables for Easy Styling */
        :root {
            --gold: #D4AF37;
            --light-gold: #F3E5AB;
            --glass: rgba(15, 15, 25, 0.85);
            --border: rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Screen အပြည့်ဖြစ်စေပြီး Scroll မရှိစေရန် */
        body, html {
            height: 100vh;
            width: 100%;
            font-family: 'Poppins', 'Pyidaungsu', sans-serif;
            background-color: #000;
            overflow: hidden;
            color: #fff;
        }

        /* --- ထင်ရှားသော နောက်ခံပုံ (Background Section) --- */
        .main-wrapper {
            height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1624314138470-5a2f24623f10?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* Header Layout */
        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Noto Serif Myanmar', serif;
            color: var(--gold);
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            margin-bottom: 5px;
        }

        header p {
            color: var(--light-gold);
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* --- စိပ်စိပ်လက်လက် Content Grid --- */
        .content-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 950px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h2 {
            font-family: 'Noto Serif Myanmar', serif;
            color: var(--gold);
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* Video Section - YouTube Player */
        .video-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-box iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0;
        }

        /* Audio Section - Radio Player */
        .audio-wrapper {
            background: rgba(0,0,0,0.4);
            border-radius: 50px;
            padding: 10px;
            margin-bottom: 15px;
        }

        audio {
            width: 100%;
            height: 32px;
        }

        .info-list {
            list-style: none;
            padding-left: 0;
        }

        .info-list li {
            font-size: 0.85rem;
            color: #ddd;
            margin-bottom: 8px;
            padding-left: 25px;
            position: relative;
        }

        .info-list li::before {
            content: '☸';
            color: var(--gold);
            position: absolute;
            left: 0;
            font-size: 1rem;
        }

        footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
        }

        /* Mobile Layout */
        @media (max-width: 768px) {
            body, html { overflow: auto; }
            .main-wrapper { height: auto; min-height: 100vh; padding: 30px 15px; }
            .content-container { grid-template-columns: 1fr; gap: 15px; }
            header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <header>
        <h1>ကြည်နူးဖွယ်ရာ ဓမ္မကမ္ဘာ</h1>
        <p>Serene Dhamma World</p>
    </header>

    <div class="content-container">
        <!-- ဘယ်ဘက်ခြမ်း: ရုပ်သံလွှင့်စဉ် -->
        <div class="card">
            <h2>ဓမ္မရုပ်သံလွှင့်စဉ်</h2>
            <div class="video-box">
                <!-- YouTube Uploads Playlist ID ကို တိုက်ရိုက်သုံးထားပါသည် -->
                <iframe 
                    src="https://www.youtube.com/embed/videoseries?list=UULP18_Y-3-M89M9pA9qE0hA" 
                    title="Dhamma Video Player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <p style="color: #aaa; font-size: 0.75rem; margin-top: 10px; text-align: center;">
                မအိဖြူလှိုင်(ညောင်လေးပင်)၏ တရားတော်များ
            </p>
        </div>

        <!-- ညာဘက်ခြမ်း: အသံလွှင့်ဌာန -->
        <div class="card">
            <h2>ဓမ္မအသံလွှင့်ဌာန</h2>
            <div class="audio-wrapper">
                <audio controls>
                    <source src="https://dhamma.pmyanmar.com/stream" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>
            <ul class="info-list">
                <li>၂၄ နာရီ ပရိတ်၊ ပဋ္ဌာန်းနှင့် တရားတော်များ</li>
                <li>စိတ်အေးချမ်းစေမည့် ဓမ္မတေးများ</li>
                <li>နေ့စဉ် ဓမ္မရသ ဆင်ခြင်ဖွယ်ရာများ</li>
            </ul>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Serene Dhamma World | P-Myanmar Media</p>
    </footer>
</div>

</body>
</html>
